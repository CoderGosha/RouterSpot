# Сборка APK на каждый push и pull request; на тег v* — ещё и релиз на GitHub.
#
#   git tag v0.1-debug.27 && git push github v0.1-debug.27
#
# Пока собирается debug-вариант. Чтобы обновления ставились поверх прошлых версий, все сборки
# должны быть подписаны одним ключом: положите debug.keystore в секрет DEBUG_KEYSTORE
# (base64 -w0 debug.keystore). Без секрета Gradle создаст новый ключ на каждый запуск.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-user
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 -d > "$ANDROID_USER_HOME/debug.keystore"
          else
            echo "::warning::нет секрета DEBUG_KEYSTORE, APK будет подписан случайным ключом"
          fi

      - name: Dependencies
        run: ./scripts/fetch-deps.sh

      - name: Build
        run: ./gradlew --console=plain assembleDebug

      - name: Name APK
        id: apk
        run: |
          name=RouterSpot-${GITHUB_REF_NAME//\//-}.apk
          [ "$GITHUB_REF_TYPE" = tag ] || name=RouterSpot-$(git rev-parse --short HEAD).apk
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "Отладочная сборка, подписана debug-ключом. / Debug build, signed with a debug key."
            echo
            echo "SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo
            echo "## Изменения / Changes"
            git log --format='- %s' ${prev:+"$prev"..}HEAD
          } > notes.md
          flags=()
          [[ "$GITHUB_REF_NAME" == *debug* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$APK" --title "RouterSpot $GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
